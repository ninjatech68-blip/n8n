name: Hugging Face Space Heartbeat

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

jobs:
  ping-space:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Space
        run: |
          curl --fail --show-error --silent --max-time 30 \
            https://ps2109-n8n.hf.space/healthz >/dev/null
