name: Hugging Face Space Heartbeat

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

jobs:
  ping-space:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Space
        env:
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_SPACE_URL" ]; then
            echo "HF_SPACE_URL secret is missing"
            exit 1
          fi

          if [ -n "$HF_TOKEN" ]; then
            curl -fsS \
              -H "Authorization: Bearer $HF_TOKEN" \
              "$HF_SPACE_URL" >/dev/null
          else
            curl -fsS "$HF_SPACE_URL" >/dev/null
          fi
